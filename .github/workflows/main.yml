name: Bygg GigSplit APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installera Android SDK
        uses: android-actions/setup-android@v3

      - name: Installera Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Kompilera Debug APK
        run: |
          if [ -f "GigSplit-Android/settings.gradle" ]; then
            cd GigSplit-Android
          fi
          gradle assembleDebug --no-daemon

      - name: Spara färdig APK för nedladdning
        uses: actions/upload-artifact@v4
        with:
          name: GigSplit-Installationsfil-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
